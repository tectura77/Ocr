name: Build Flutter Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK via GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Backup Custom Files Before Scaffold
        run: "cp pubspec.yaml /tmp/pubspec.yaml.bak && if [ -f lib/main.dart ] && [ -f main.dart ]; then if [ main.dart -nt lib/main.dart ]; then cp main.dart /tmp/main.dart.bak; else cp lib/main.dart /tmp/main.dart.bak; fi; elif [ -f main.dart ]; then cp main.dart /tmp/main.dart.bak; elif [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart.bak; fi && if [ -f android/app/src/main/AndroidManifest.xml ]; then cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak; elif [ -f AndroidManifest.xml ]; then cp AndroidManifest.xml /tmp/AndroidManifest.xml.bak; fi"

      - name: Create Flutter Platform Scaffold
        run: "flutter create --org com.example --project-name doc_snap_archive ."

      - name: Restore Custom Files and Configure Dependencies
        run: "mkdir -p lib android/app/src/main && sed -e '/flutter_web_auth_2/d' -e '/_signInWithMicrosoft/d' /tmp/pubspec.yaml.bak > pubspec.yaml && sed -e '/flutter_web_auth_2/d' /tmp/main.dart.bak > lib/main.dart && flutter pub add image google_mlkit_text_recognition && if [ -f /tmp/AndroidManifest.xml.bak ]; then sed -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&quot;/\"/g' -e 's/package=\"com.example.doc_snap_archive\"//g' /tmp/AndroidManifest.xml.bak > android/app/src/main/AndroidManifest.xml; fi"

      - name: Upgrade AGP, Gradle, Kotlin, SDK 35, and Korean OCR Native Libs
        run: "printf '\\n-dontwarn com.google.mlkit.**\\n-keep class com.google.mlkit.** { *; }\\n-keep class com.google.android.gms.** { *; }\\n-dontwarn javax.annotation.**\\n-dontwarn org.codehaus.mojo.animal_sniffer.**\\n' > android/app/proguard-rules.pro && find android -maxdepth 2 -name '*gradle*' -type f -exec sed -i -E 's/8\\.[0-6]\\.[0-9]+/8.7.0/g; s/7\\.[0-9]+\\.[0-9]+/8.7.0/g; s/1\\.[789]\\.[0-9]+/2.0.21/g' {} + && sed -i -E 's/gradle-[0-9.]+-(all|bin)\\.zip/gradle-8.10.2-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties && find android/app -name 'build.gradle*' -type f -exec sed -i -E 's/compileSdk\\s*=\\s*flutter\\.compileSdkVersion/compileSdk = 35/g; s/compileSdkVersion\\s+flutter\\.compileSdkVersion/compileSdkVersion 35/g; s/targetSdk\\s*=\\s*flutter\\.targetSdkVersion/targetSdk = 35/g; s/targetSdkVersion\\s+flutter\\.targetSdkVersion/targetSdkVersion 35/g; s/minSdk\\s*=\\s*flutter\\.minSdkVersion/minSdk = 21/g; s/minSdkVersion\\s+flutter\\.minSdkVersion/minSdkVersion 21/g; s/signingConfig\\s*=\\s*signingConfigs\\.getByName\\(\"debug\"\\)/signingConfig = signingConfigs.getByName(\"debug\")\\n            isMinifyEnabled = false\\n            isShrinkResources = false/g; s/signingConfig\\s+signingConfigs\\.debug/signingConfig signingConfigs.debug\\n            minifyEnabled false\\n            shrinkResources false/g' {} + && for f in android/app/build.gradle*; do [ -f \"$f\" ] && printf '\\ndependencies {\\n    implementation(\"com.google.mlkit:text-recognition-korean:16.0.1\")\\n}\\n' >> \"$f\"; done"

      - name: Install Dependencies and Analyze Dart Code
        run: "flutter pub get && dart analyze lib/main.dart"

      - name: Build Release APK
        run: "flutter build apk --release --no-tree-shake-icons"

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-snap-archive-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
