name: Build Flutter Android & iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK via GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Backup Custom Files Before Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          if [ -f icon.png ]; then cp icon.png /tmp/icon.png.bak && echo "Found icon.png"; fi
          if [ -f lib/main.dart ]; then
            cp lib/main.dart /tmp/main.dart.bak
          elif [ -f main.dart ]; then
            cp main.dart /tmp/main.dart.bak
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          elif [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          fi

      - name: Create Flutter Platform Scaffold
        run: "rm -rf android ios && flutter create --platforms=android --org com.example --project-name doc_snap_archive ."

      - name: Restore Custom Files, Configure Dependencies, and Generate Android App Icon from icon.png
        run: |
          mkdir -p lib android/app/src/main
          sed -e '/flutter_web_auth_2/d' /tmp/pubspec.yaml.bak > pubspec.yaml
          sed -e '/flutter_web_auth_2/d' /tmp/main.dart.bak > lib/main.dart
          cp lib/main.dart main.dart
          if [ -f /tmp/icon.png.bak ]; then cp /tmp/icon.png.bak icon.png; fi
          flutter pub add image google_mlkit_text_recognition
          flutter pub add --dev flutter_launcher_icons
          if [ -f icon.png ]; then
            printf '\nflutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "icon.png"\n  min_sdk_android: 21\n  adaptive_icon_background: "#1E3A8A"\n  adaptive_icon_foreground: "icon.png"\n' >> pubspec.yaml
            flutter pub get
            dart run flutter_launcher_icons
          else
            flutter pub get
          fi
          if [ -f /tmp/AndroidManifest.xml.bak ]; then
            sed -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&quot;/"/g' -e 's/package="com.example.doc_snap_archive"//g' /tmp/AndroidManifest.xml.bak > android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure Gradle, SDK 35, ProGuard Rules, and Disable R8 Minification
        run: |
          printf '\n-dontwarn com.google.mlkit.**\n-keep class com.google.mlkit.** { *; }\n-keep class com.google.android.gms.** { *; }\n-dontwarn javax.annotation.**\n-dontwarn org.codehaus.mojo.animal_sniffer.**\n-dontoptimize\n-dontshrink\n' > android/app/proguard-rules.pro
          find android -maxdepth 2 -name '*gradle*' -type f -exec sed -i -E 's/8\.[0-6]\.[0-9]+/8.7.0/g; s/7\.[0-9]+\.[0-9]+/8.7.0/g; s/1\.[789]\.[0-9]+/2.0.21/g' {} +
          sed -i -E 's/gradle-[0-9.]+-(all|bin)\.zip/gradle-8.10.2-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 35/g; s/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 35/g; s/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
            printf '\nandroid {\n    buildTypes {\n        getByName("release") {\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")\n        }\n    }\n}\ndependencies {\n    implementation("com.google.mlkit:text-recognition-korean:16.0.1")\n}\n' >> android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 35/g; s/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 35/g; s/targetSdk\s*=\s*flutter\.targetSdkVersion/targetSdk = 35/g; s/targetSdkVersion\s+flutter\.targetSdkVersion/targetSdkVersion 35/g; s/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 21/g; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
            printf '\nandroid {\n    buildTypes {\n        release {\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }\n    }\n}\ndependencies {\n    implementation "com.google.mlkit:text-recognition-korean:16.0.1"\n}\n' >> android/app/build.gradle
          fi

      - name: Install Dependencies and Analyze Dart Code
        run: "flutter pub get && dart analyze --no-fatal-warnings --no-fatal-infos lib/main.dart"

      - name: Build Release APK (R8 Disabled)
        run: "flutter build apk --release --no-tree-shake-icons -Pshrink=false"

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-snap-archive-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS App (No Codesign)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Backup Custom Files Before Scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          if [ -f icon.png ]; then cp icon.png /tmp/icon.png.bak; fi
          if [ -f lib/main.dart ]; then
            cp lib/main.dart /tmp/main.dart.bak
          elif [ -f main.dart ]; then
            cp main.dart /tmp/main.dart.bak
          fi

      - name: Create Flutter iOS Scaffold
        run: "rm -rf ios && flutter create --platforms=ios --org com.example --project-name doc_snap_archive ."

      - name: Restore Custom Files, Generate iOS App Icon, and Configure iOS Podfile (iOS 15.5)
        run: |
          mkdir -p lib
          sed -e '/flutter_web_auth_2/d' /tmp/pubspec.yaml.bak > pubspec.yaml
          sed -e '/flutter_web_auth_2/d' /tmp/main.dart.bak > lib/main.dart
          cp lib/main.dart main.dart
          if [ -f /tmp/icon.png.bak ]; then cp /tmp/icon.png.bak icon.png; fi
          flutter pub add image google_mlkit_text_recognition
          flutter pub add --dev flutter_launcher_icons
          if [ -f icon.png ]; then
            printf '\nflutter_launcher_icons:\n  android: false\n  ios: true\n  image_path: "icon.png"\n  remove_alpha_ios: true\n' >> pubspec.yaml
            flutter pub get
            dart run flutter_launcher_icons
          else
            flutter pub get
          fi
          sed -i '' "s/.*platform :ios.*/platform :ios, '15.5'/g" ios/Podfile || true
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS App (No Codesign) and Package Unsigned IPA
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          cp -R "$APP_PATH" build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa && zip -qry doc-snap-archive-unsigned.ipa Payload

      - name: Upload Unsigned IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-snap-archive-unsigned-ipa
          path: build/ios/ipa/doc-snap-archive-unsigned.ipa
          if-no-files-found: error
