    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtNum(n) {
      const v = parseInt(String(n || '0').replace(/[^0-9-]/g, ''), 10) || 0;
      return v.toLocaleString('ko-KR');
    }

    function fmtQty(val) {
      const v = parseFloat(String(val || '0').replace(/[^0-9.-]/g, '')) || 0;
      if (Math.abs(v - Math.round(v)) < 0.0005) return Math.round(v).toLocaleString('ko-KR');
      return Number(v.toFixed(3)).toString();
    }

    function parseInvoiceQty(r) {
      const f = r.fields || {};
      return parseFloat(String(f.quantity || '0').replace(/,/g, '').replace(/[^0-9.-]/g, '')) || 0;
    }

    function normalizeDocNum(raw) {
      if (!raw) return '';
      return String(raw).replace(/[^a-zA-Z0-9가-힣]/g, '').toUpperCase();
    }

    function computeRepliedDocMap() {
      const keys = {};
      archiveRecords.forEach(function(r) {
        if (r.category === '공문(발신)') {
          const k = normalizeDocNum((r.fields || {}).replyDocNumber);
          if (k) keys[k] = true;
        }
      });
      return keys;
    }

    function parseApprovalList(r) {
      const f = r.fields || {};
      const raw = (f.approvalsJson || '').trim();
      if (!raw) return [];
      try {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
      return [];
    }

    function isDirector(name) {
      return String(name || '').indexOf('소장') !== -1;
    }

    function buildApprovalCellHtml(r) {
      const list = parseApprovalList(r);
      const done = list.some(function(e) { return isDirector(e.name) || e.role === '결재'; });
      let cls = 'appr-badge';
      let txt = '미결';
      if (done) {
        cls = 'appr-badge done';
        txt = '결재완료';
      } else if (list.length > 0) {
        cls = 'appr-badge review';
        txt = '검토(' + list.length + ')';
      }
      return '<td><span class="' + cls + '" onclick="openApprovalModal(\'' + r.id + '\', event)">' + txt + '</span></td>';
    }

    function ensureCurrentUserName() {
      if (currentUserName && currentUserName.trim()) return currentUserName.trim();
      const entered = prompt('결재/검토자 이름을 입력하세요 (소장님은 이름에 "소장" 포함):', '');
      if (entered && entered.trim()) {
        currentUserName = entered.trim();
        return currentUserName;
      }
      return '';
    }

    function todayDotStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return yyyy + '.' + mm + '.' + dd;
    }

    function openApprovalModal(recId, ev) {
      if (ev) ev.stopPropagation();
      const r = archiveRecords.find(function(x) { return x.id === recId; });
      if (!r) return;
      const list = parseApprovalList(r);
      if (list.length === 0) {
        const u = ensureCurrentUserName();
        if (!u) return;
        list.push({ name: u, date: todayDotStr(), role: isDirector(u) ? '결재' : '검토' });
        if (!r.fields) r.fields = {};
        r.fields.approvalsJson = JSON.stringify(list);
        render();
        return;
      }
      activeApprovalRecId = recId;
      renderApprovalModalContent();
      document.getElementById('appr-modal-bg').style.display = 'flex';
    }

    function renderApprovalModalContent() {
      const r = archiveRecords.find(function(x) { return x.id === activeApprovalRecId; });
      if (!r) return;
      const list = parseApprovalList(r);
      const done = list.some(function(e) { return isDirector(e.name) || e.role === '결재'; });
      document.getElementById('appr-modal-title').textContent = done ? '✅ 결재완료 이력' : ('📝 검토·결재 이력 (' + list.length + '명)');
      const box = document.getElementById('appr-modal-list');
      box.innerHTML = list.map(function(e, i) {
        const dir = isDirector(e.name) || e.role === '결재';
        const roleTag = dir ? '최종결재' : ('검토 ' + (i + 1));
        const bg = dir ? '#f0fdf4' : '#eff6ff';
        const bd = dir ? '#86efac' : '#bfdbfe';
        const tagBg = dir ? '#15803d' : '#1e3a8a';
        const canCancel = currentUserName && e.name === currentUserName;
        return '<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:8px; background:' + bg + '; border:1px solid ' + bd + ';">' +
          '<div><span style="background:' + tagBg + '; color:#fff; padding:2px 6px; border-radius:4px; font-size:10.5px; font-weight:800; margin-right:6px;">' + roleTag + '</span>' +
          '<strong style="font-size:13px;">' + escapeHtml(e.name) + '</strong></div>' +
          '<div style="display:flex; align-items:center; gap:6px;"><span style="font-size:11.5px; color:#64748b;">' + escapeHtml(e.date || '-') + '</span>' +
          (canCancel ? '<button style="border:1px solid #fca5a5; background:#fef2f2; color:#dc2626; border-radius:4px; padding:2px 6px; font-size:10px; font-weight:800; cursor:pointer;" onclick="removeMyApprovalInModal(\'' + escapeHtml(e.name) + '\')">결재취소</button>' : '') +
          '</div></div>';
      }).join('');
    }

    function addMyApprovalInModal() {
      const r = archiveRecords.find(function(x) { return x.id === activeApprovalRecId; });
      if (!r) return;
      const u = ensureCurrentUserName();
      if (!u) return;
      const list = parseApprovalList(r);
      if (!list.some(function(e) { return e.name === u; })) {
        list.push({ name: u, date: todayDotStr(), role: isDirector(u) ? '결재' : '검토' });
        const reviewers = list.filter(function(e) { return !isDirector(e.name); });
        const directors = list.filter(function(e) { return isDirector(e.name); });
        if (!r.fields) r.fields = {};
        r.fields.approvalsJson = JSON.stringify(reviewers.concat(directors));
      }
      renderApprovalModalContent();
      render();
    }

    function removeMyApprovalInModal(targetName) {
      const r = archiveRecords.find(function(x) { return x.id === activeApprovalRecId; });
      if (!r) return;
      const list = parseApprovalList(r).filter(function(e) { return e.name !== targetName; });
      if (!r.fields) r.fields = {};
      if (list.length === 0) {
        delete r.fields.approvalsJson;
        closeApprovalModal();
      } else {
        r.fields.approvalsJson = JSON.stringify(list);
        renderApprovalModalContent();
      }
      render();
    }

    function closeApprovalModal() {
      document.getElementById('appr-modal-bg').style.display = 'none';
      activeApprovalRecId = null;
    }

    function getInvoiceGroupKey(r) {
      const f = r.fields || {};
      const prod = (f.productName || '').trim() || '기타자재';
      const spec = (f.specName || '').trim() || '규격미상';
      if (invGroupProduct && invGroupSpec) {
        return prod + '. ' + spec;
      } else if (!invGroupProduct && invGroupSpec) {
        return spec;
      } else {
        return prod;
      }
    }

    function toggleInvoiceGroup(col) {
      if (col === 'product') {
        if (!invGroupProduct && invGroupSpec) {
          invGroupProduct = true;
        } else {
          invGroupProduct = true;
          invGroupSpec = false;
        }
        selectedProductFilter = '전체';
        toggleSort('product');
      } else if (col === 'spec') {
        if (invGroupProduct && !invGroupSpec) {
          invGroupSpec = true;
        } else if (invGroupProduct && invGroupSpec) {
          invGroupProduct = false;
          invGroupSpec = true;
        } else {
          invGroupProduct = true;
          invGroupSpec = false;
        }
        selectedProductFilter = '전체';
        toggleSort('spec');
      }
    }

    function computeInvoiceCumulativeMap() {
      const invList = archiveRecords.filter(function(r) { return r.category === '자재송장'; }).slice();
      invList.sort(function(a, b) {
        const da = ((a.fields && a.fields.arrivalDate) || '').trim();
        const db = ((b.fields && b.fields.arrivalDate) || '').trim();
        if (da !== db) return da.localeCompare(db);
        return String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
      });
      const sums = {};
      const map = {};
      invList.forEach(function(r) {
        const f = r.fields || {};
        const key = ((f.productName || '').trim() + '|' + (f.specName || '').trim()).toLowerCase();
        const q = parseInvoiceQty(r);
        sums[key] = (sums[key] || 0) + q;
        map[r.id] = fmtQty(sums[key]);
      });
      return map;
    }

    function getExtraArray(r) {
      if (!r.fields) r.fields = {};
      const raw = r.fields.proofImagesJson || '';
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      } catch (e) {}
      return [];
    }

    function setExtraArray(r, arr) {
      if (!r.fields) r.fields = {};
      r.fields.proofImagesJson = JSON.stringify(arr);
      r.fields.proofStatus = arr.length > 0 ? ('첨부(' + arr.length + '장)') : '미첨부';
    }

    function getRecordAmount(r) {
      const f = r.fields || {};
      let raw = '0';
      if (r.category === '병원비') raw = f.totalPaid || '0';
      else if (r.category === '출장비') raw = f.totalAmount || '0';
      else raw = f.amount || '0';
      return parseInt(String(raw).replace(/[^0-9-]/g, ''), 10) || 0;
    }

    function isClaimed(r) {
      const v = String((r.fields && r.fields.isClaimed) || '').toUpperCase();
      return v === 'Y' || v === 'TRUE' || v === '1' || v === '청구완료';
    }

    function toggleClaimed(recId, ev) {
      if (ev) ev.stopPropagation();
      const rec = archiveRecords.find(function(x) { return x.id === recId; });
      if (!rec) return;
      if (!rec.fields) rec.fields = {};
      rec.fields.isClaimed = isClaimed(rec) ? 'N' : 'Y';
      render();
    }

    function getRecordDateStr(r) {
      const f = r.fields || {};
      if (r.category === '공문(수신)' || r.category === '공문(발신)') return f.sentDate || '';
      if (r.category === '자재송장') return f.arrivalDate || '';
      if (r.category === '출장비') return f.date || '';
      if (r.category === '병원비') return f.issueDate || '';
      if (r.category === '명함관리') return f.cardDate || '';
      if (r.category === 'PDF변환') return f.pdfDate || '';
      return r.createdAt || '';
    }

    function getMajorRecords() {
      return archiveRecords.filter(function(r) {
        return r.category === selectedCategoryFilter;
      });
    }

    function getFiltered() {
      const repliedMap = computeRepliedDocMap();
      const list = getMajorRecords().filter(function(r) {
        const f = r.fields || {};
        if (selectedCategoryFilter === '병원비') {
          if (selectedSubCat !== '전체') {
            const gKey = getMedicalGroupKey(r);
            if (gKey !== selectedSubCat) return false;
          }
          if (selectedClaimFilter === '청구완료' && !isClaimed(r)) return false;
          if (selectedClaimFilter === '미청구' && isClaimed(r)) return false;
        } else if (selectedCategoryFilter === '출장비') {
          if (selectedSubCat !== '전체') {
            const sc = (f.subCategory || '').trim() || '미지정';
            if (sc !== selectedSubCat) return false;
          }
          if (selectedTravelDiv !== '전체') {
            if ((f.travelDivision || '기타') !== selectedTravelDiv) return false;
          }
        } else if (selectedCategoryFilter === '자재송장') {
          if (selectedProductFilter !== '전체') {
            if (getInvoiceGroupKey(r) !== selectedProductFilter) return false;
          }
        }
        return true;
      });

      list.sort(function(a, b) {
        const fa = a.fields || {};
        const fb = b.fields || {};
        let cmp = 0;
        if (sortCol === 'date') {
          cmp = getRecordDateStr(a).localeCompare(getRecordDateStr(b));
        } else if (sortCol === 'amount') {
          cmp = getRecordAmount(a) - getRecordAmount(b);
        } else if (sortCol === 'quantity') {
          cmp = parseInvoiceQty(a) - parseInvoiceQty(b);
        } else if (sortCol === 'patient') {
          cmp = String(fa.patientName || '').localeCompare(String(fb.patientName || ''), 'ko');
        } else if (sortCol === 'subCategory') {
          cmp = String(fa.subCategory || '').localeCompare(String(fb.subCategory || ''), 'ko');
        } else if (sortCol === 'clinic') {
          const ca = fa.clinicName || fa.merchantName || fa.sender || fa.recipient || '';
          const cb = fb.clinicName || fb.merchantName || fb.sender || fb.recipient || '';
          cmp = String(ca).localeCompare(String(cb), 'ko');
        } else if (sortCol === 'product') {
          cmp = String(fa.productName || '').localeCompare(String(fb.productName || ''), 'ko');
          if (cmp === 0) cmp = String(fa.specName || '').localeCompare(String(fb.specName || ''), 'ko');
        } else if (sortCol === 'spec') {
          cmp = String(fa.specName || '').localeCompare(String(fb.specName || ''), 'ko');
          if (cmp === 0) cmp = String(fa.productName || '').localeCompare(String(fb.productName || ''), 'ko');
        } else if (sortCol === 'claimed') {
          cmp = (isClaimed(a) ? 1 : 0) - (isClaimed(b) ? 1 : 0);
        } else if (sortCol === 'replied') {
          const ra = repliedMap[normalizeDocNum(fa.docNumber)] ? 1 : 0;
          const rb = repliedMap[normalizeDocNum(fb.docNumber)] ? 1 : 0;
          cmp = ra - rb;
        } else if (sortCol === 'approval') {
          cmp = parseApprovalList(a).length - parseApprovalList(b).length;
        } else {
          cmp = String(fa[sortCol] || '').localeCompare(String(fb[sortCol] || ''), 'ko');
        }
        return sortAsc ? cmp : -cmp;
      });
      return list;
    }

    function toggleSort(col) {
      if (sortCol === col) {
        sortAsc = !sortAsc;
      } else {
        sortCol = col;
        sortAsc = true;
      }
      render();
    }

    function sortArrow(col) {
      if (sortCol !== col) return '<span style="color:#94a3b8; font-size:10px;"> ↕</span>';
      return sortAsc
        ? '<span style="color:#1e3a8a; font-weight:900;"> ▲</span>'
        : '<span style="color:#1e3a8a; font-weight:900;"> ▼</span>';
    }

    function thClass(col, isGroupActive) {
      const classes = [];
      if (isGroupActive) classes.push('hi-group');
      else if (sortCol === col) classes.push('sorted-col');
      return classes.join(' ');
    }

    function selectRow(id) {
      if (selectedId !== id) {
        selectedId = id;
        selectedPageIdx = 0;
        resetZoom();
      }
      render();
    }

    function selectRowPage(id, pIdx, ev) {
      if (ev) ev.stopPropagation();
      selectedId = id;
      selectedPageIdx = pIdx;
      resetZoom();
      render();
    }

    function getMedicalGroupKey(r) {
      const f = r.fields || {};
      const sc = (f.subCategory || '').trim() || '미지정';
      const pat = (f.patientName || '').trim() || '환자미상';
      if (medSumByCat && medSumByPatient) return sc + '. ' + pat;
      if (medSumByPatient) return pat;
      return sc;
    }

    function toggleMedicalGroup(col) {
      if (col === 'cat') {
        if (!medSumByCat && medSumByPatient) {
          medSumByCat = true;
        } else {
          medSumByCat = true;
          medSumByPatient = false;
        }
        selectedSubCat = '전체';
        toggleSort('subCategory');
      } else if (col === 'patient') {
        if (medSumByCat && !medSumByPatient) {
          medSumByCat = false;
          medSumByPatient = true;
        } else if (!medSumByCat && medSumByPatient) {
          medSumByCat = true;
          medSumByPatient = true;
        } else {
          medSumByCat = false;
          medSumByPatient = true;
        }
        selectedSubCat = '전체';
        toggleSort('patient');
      }
    }

    function buildPageButtonsHtml(r, totalPages) {
      return '<div style="white-space:nowrap; display:inline-flex; align-items:center; gap:3px;">' +
        '<span style="font-weight:900; color:#0f766e;">' + totalPages + '장</span>' +
        '<button style="border:1px solid #93c5fd; background:#eff6ff; color:#1e3a8a; border-radius:4px; padding:1px 5px; font-size:10px; font-weight:900; cursor:pointer;" onclick="selectRow(\'' + r.id + '\'); triggerAddExtraPage(); event.stopPropagation();">+</button>' +
        '</div>';
    }

    function changeZoom(delta) {
      currentZoom = Math.min(8.0, Math.max(0.15, currentZoom + delta));
      applyZoom();
    }
    function resetZoom() {
      currentZoom = 1.0;
      panX = 0;
      panY = 0;
      applyZoom();
    }
    function applyZoom() {
      const img = document.getElementById('preview-img');
      const lbl = document.getElementById('zoom-label');
      if (img) {
        img.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + currentZoom + ')';
      }
      if (lbl) lbl.textContent = Math.round(currentZoom * 100) + '%';
    }

    function removeExtraPage(idx, ev) {
      if (ev) ev.stopPropagation();
      const cur = archiveRecords.find(function(r) { return r.id === selectedId; });
      if (!cur) return;
      const arr = getExtraArray(cur).slice();
      if (idx >= 0 && idx < arr.length) {
        arr.splice(idx, 1);
        setExtraArray(cur, arr);
        selectedPageIdx = 0;
        render();
      }
    }

    function triggerAddExtraPage() {
      const inp = document.getElementById('extra-file-input');
      if (inp) { inp.value = ''; inp.click(); }
    }

    function handleExtraFilesSelected(ev) {
      const files = ev.target.files;
      if (!files || files.length === 0) return;
      const cur = archiveRecords.find(function(r) { return r.id === selectedId; });
      if (!cur) return;
      const arr = getExtraArray(cur).slice();
      let loaded = 0;
      for (let i = 0; i < files.length; i++) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const res = String(e.target.result || '');
          const b64 = res.indexOf(',') !== -1 ? res.split(',').pop() : res;
          if (b64) arr.push(b64);
          loaded++;
          if (loaded === files.length) {
            setExtraArray(cur, arr);
            selectedPageIdx = arr.length;
            render();
          }
        };
        reader.readAsDataURL(files[i]);
      }
    }

    function renderSummaryBar() {
      const bar = document.getElementById('summary-bar');
      const majorList = getMajorRecords();
      if (selectedCategoryFilter === '자재송장') {
        bar.style.display = 'flex';
        const groups = {};
        majorList.forEach(function(r) {
          const f = r.fields || {};
          const prod = (f.productName || '').trim();
          const u = (f.unit || '').trim() || (prod.indexOf('철근') !== -1 ? 'ton' : '매');
          const q = parseInvoiceQty(r);
          const gKey = getInvoiceGroupKey(r);
          if (!groups[gKey]) groups[gKey] = { cnt: 0, sum: 0, unit: u };
          groups[gKey].cnt++;
          groups[gKey].sum += q;
        });
        const allLabel = '전체 ' + majorList.length + '장';
        let chipsHtml = '<button class="chip-btn ' + (selectedProductFilter === '전체' ? 'active' : '') + '" onclick="selectedProductFilter=\'전체\'; render();">' + escapeHtml(allLabel) + '</button>';
        Object.keys(groups).forEach(function(k) {
          const g = groups[k];
          const cls = selectedProductFilter === k ? 'chip-btn active' : 'chip-btn';
          chipsHtml += '<button class="' + cls + '" onclick="selectedProductFilter=\'' + escapeHtml(k) + '\'; render();">' + escapeHtml(k) + ' (' + g.cnt + '건 · ' + fmtQty(g.sum) + escapeHtml(g.unit) + ')</button>';
        });
        const modeLabel = (invGroupProduct && invGroupSpec) ? '제품명. 규격별' : (invGroupSpec ? '규격명별' : '제품명별');
        bar.innerHTML =
          '<div class="sum-sub">📊 합산기준: ' + modeLabel + ' (표의 [제품명]·[규격명] 제목을 누르면 합산 기준 전환)</div>' +
          '<div class="sub-row">' + chipsHtml + '</div>';
      } else if (selectedCategoryFilter === '병원비') {
        bar.style.display = 'flex';
        const totalSum = majorList.reduce(function(acc, r) { return acc + getRecordAmount(r); }, 0);
        const groups = {};
        majorList.forEach(function(r) {
          const key = getMedicalGroupKey(r);
          if (!groups[key]) groups[key] = { cnt: 0, sum: 0 };
          groups[key].cnt++;
          groups[key].sum += getRecordAmount(r);
        });
        let chipsHtml = '<button class="chip-btn ' + (selectedSubCat === '전체' ? 'active' : '') + '" onclick="selectedSubCat=\'전체\'; render();">전체 (' + majorList.length + '건 · ' + fmtNum(totalSum) + '원)</button>';
        Object.keys(groups).forEach(function(k) {
          const g = groups[k];
          const cls = selectedSubCat === k ? 'chip-btn active' : 'chip-btn';
          chipsHtml += '<button class="' + cls + '" onclick="selectedSubCat=\'' + escapeHtml(k) + '\'; render();">' + escapeHtml(k) + ' (' + g.cnt + '건 · ' + fmtNum(g.sum) + '원)</button>';
        });

        let unclaimedCnt = 0, unclaimedSum = 0, claimedCnt = 0, claimedSum = 0;
        majorList.forEach(function(r) {
          if (isClaimed(r)) { claimedCnt++; claimedSum += getRecordAmount(r); }
          else { unclaimedCnt++; unclaimedSum += getRecordAmount(r); }
        });
        const claimHtml =
          '<button class="chip-btn ' + (selectedClaimFilter === '전체' ? 'active' : '') + '" onclick="selectedClaimFilter=\'전체\'; render();">청구전체 (' + majorList.length + '건)</button>' +
          '<button class="chip-btn ' + (selectedClaimFilter === '미청구' ? 'active' : '') + '" style="color:#be123c;" onclick="selectedClaimFilter=\'미청구\'; render();">미청구 (' + unclaimedCnt + '건 · ' + fmtNum(unclaimedSum) + '원)</button>' +
          '<button class="chip-btn ' + (selectedClaimFilter === '청구완료' ? 'active' : '') + '" style="color:#15803d;" onclick="selectedClaimFilter=\'청구완료\'; render();">청구완료 (' + claimedCnt + '건 · ' + fmtNum(claimedSum) + '원)</button>';

        const medModeStr = (medSumByCat && medSumByPatient) ? '카테고리. 환자별' : (medSumByPatient ? '환자별' : '카테고리별');
        bar.innerHTML =
          '<div class="sum-title">병원비 합계 [' + medModeStr + '] (' + majorList.length + '건): ' + fmtNum(totalSum) + '원</div>' +
          '<div class="sub-row">' + chipsHtml + '</div>' +
          '<div class="sub-row">' + claimHtml + '</div>';
      } else if (selectedCategoryFilter === '출장비') {
        bar.style.display = 'flex';
        const totalSum = majorList.reduce(function(acc, r) { return acc + getRecordAmount(r); }, 0);
        const groups = {};
        majorList.forEach(function(r) {
          const sc = ((r.fields && r.fields.subCategory) || '').trim() || '미지정';
          if (!groups[sc]) groups[sc] = { cnt: 0, sum: 0 };
          groups[sc].cnt++;
          groups[sc].sum += getRecordAmount(r);
        });
        let chipsHtml = '<button class="chip-btn ' + (selectedSubCat === '전체' ? 'active' : '') + '" onclick="selectedSubCat=\'전체\'; render();">전체 (' + majorList.length + '건 · ' + fmtNum(totalSum) + '원)</button>';
        Object.keys(groups).forEach(function(k) {
          const g = groups[k];
          const cls = selectedSubCat === k ? 'chip-btn active' : 'chip-btn';
          chipsHtml += '<button class="' + cls + '" onclick="selectedSubCat=\'' + escapeHtml(k) + '\'; render();">' + escapeHtml(k) + ' (' + g.cnt + '건 · ' + fmtNum(g.sum) + '원)</button>';
        });
        bar.innerHTML =
          '<div class="sum-title">출장비 합계 (' + majorList.length + '건): ' + fmtNum(totalSum) + '원</div>' +
          '<div class="sub-row">' + chipsHtml + '</div>';
      } else {
        bar.style.display = 'none';
      }
    }

    function render() {
      const tabBar = document.getElementById('major-tabs-bar');
      tabBar.innerHTML = ALL_TABS.map(function(t) {
        const cnt = archiveRecords.filter(function(r) { return r.category === t; }).length;
        const cls = t === selectedCategoryFilter ? 'chip-btn active' : 'chip-btn';
        return '<button class="' + cls + '" onclick="selectedCategoryFilter=\'' + t + '\'; selectedSubCat=\'전체\'; selectedProductFilter=\'전체\'; render();">' + escapeHtml(t) + ' (' + cnt + ')</button>';
      }).join('');

      renderSummaryBar();

      const list = getFiltered();
      if (!list.some(function(r) { return r.id === selectedId; })) {
        selectedId = list.length > 0 ? list[0].id : null;
        selectedPageIdx = 0;
      }

      const thead = document.getElementById('doc-thead');
      const tbody = document.getElementById('doc-tbody');

      if (selectedCategoryFilter === '병원비') {
        thead.innerHTML = '<tr>' +
          '<th style="width:74px;" class="' + thClass('subCategory', medSumByCat) + '" onclick="toggleMedicalGroup(\'cat\');">카테고리 ' + (medSumByCat ? '✓' : '') + '<br>' + sortArrow('subCategory') + '</th>' +
          '<th style="width:70px;" class="' + thClass('patient', medSumByPatient) + '" onclick="toggleMedicalGroup(\'patient\');">환자성명 ' + (medSumByPatient ? '✓' : '') + '<br>' + sortArrow('patient') + '</th>' +
          '<th style="width:88px;" class="' + thClass('date', false) + '" onclick="toggleSort(\'date\');">날짜' + sortArrow('date') + '</th>' +
          '<th style="width:130px;" class="' + thClass('clinic', false) + '" onclick="toggleSort(\'clinic\');">상호' + sortArrow('clinic') + '</th>' +
          '<th style="width:88px;" class="' + thClass('amount', false) + '" onclick="toggleSort(\'amount\');">금액' + sortArrow('amount') + '</th>' +
          '<th style="width:108px;" class="' + thClass('bizRegNumber', false) + '" onclick="toggleSort(\'bizRegNumber\');">사업자등록번호' + sortArrow('bizRegNumber') + '</th>' +
          '<th style="width:82px;" class="' + thClass('claimed', false) + '" onclick="toggleSort(\'claimed\');">청구여부' + sortArrow('claimed') + '</th>' +
          '<th style="width:82px;">증빙첨부</th>' +
          '</tr>';
        tbody.innerHTML = list.map(function(r) {
          const f = r.fields || {};
          const sel = r.id === selectedId ? 'selected' : '';
          const claimed = isClaimed(r);
          const extraCnt = getExtraArray(r).length;
          const totalPages = 1 + extraCnt;
          return '<tr class="' + sel + '" onclick="selectRow(\'' + r.id + '\')">' +
            '<td style="font-weight:800;">' + escapeHtml(f.subCategory || '미지정') + '</td>' +
            '<td style="font-weight:800;">' + escapeHtml(f.patientName || '-') + '</td>' +
            '<td>' + escapeHtml(f.issueDate || '-') + '</td>' +
            '<td style="font-weight:800;">' + escapeHtml(f.clinicName || '-') + '</td>' +
            '<td style="font-weight:800; color:#1e3a8a;">' + fmtNum(f.totalPaid) + '원</td>' +
            '<td>' + escapeHtml(f.bizRegNumber || '-') + '</td>' +
            '<td style="font-weight:800; color:' + (claimed ? '#15803d' : '#ea580c') + ';" onclick="toggleClaimed(\'' + r.id + '\', event)">' + (claimed ? '☑ 청구완료' : '☐ 미청구') + '</td>' +
            '<td>' + buildPageButtonsHtml(r, totalPages) + '</td></tr>';
        }).join('');
      } else if (selectedCategoryFilter === '출장비') {
        thead.innerHTML = '<tr>' +
          '<th style="width:110px;" class="' + thClass('date', false) + '" onclick="toggleSort(\'date\');">카테고리(날짜)' + sortArrow('date') + '</th>' +
          '<th style="width:70px;" class="' + thClass('travelDivision', false) + '" onclick="toggleSort(\'travelDivision\');">구분' + sortArrow('travelDivision') + '</th>' +
          '<th style="width:155px;" class="' + thClass('clinic', false) + '" onclick="toggleSort(\'clinic\');">상호' + sortArrow('clinic') + '</th>' +
          '<th style="width:95px;" class="' + thClass('amount', false) + '" onclick="toggleSort(\'amount\');">금액' + sortArrow('amount') + '</th>' +
          '</tr>';

            '<th style="width:92px;" class="' + thClass('clinic', false) + '" onclick="toggleSort(\'clinic\');">보낸사람' + sortArrow('clinic') + '</th>' +
            '<th style="width:140px;" class="' + thClass('title', false) + '" onclick="toggleSort(\'title\');">제목' + sortArrow('title') + '</th>' +
            '<th style="width:165px;" class="' + thClass('aiSummary', false) + '" onclick="toggleSort(\'aiSummary\');">내용' + sortArrow('aiSummary') + '</th>' +
            '<th style="width:76px;" class="' + thClass('replyDeadline', false) + '" onclick="toggleSort(\'replyDeadline\');">회신요청일' + sortArrow('replyDeadline') + '</th>' +
            '<th style="width:58px;" class="' + thClass('replied', false) + '" onclick="toggleSort(\'replied\');">회신완료' + sortArrow('replied') + '</th>' +
            '<th style="width:64px;" class="' + thClass('uploader', false) + '" onclick="toggleSort(\'uploader\');">올린사람' + sortArrow('uploader') + '</th>' +
            '<th style="width:68px;" class="' + thClass('approval', false) + '" onclick="toggleSort(\'approval\');">결재' + sortArrow('approval') + '</th>' +
            '</tr>';
          tbody.innerHTML = list.map(function(r) {
            const f = r.fields || {};
            const sel = r.id === selectedId ? 'selected' : '';
            const isRep = !!repliedMap[normalizeDocNum(f.docNumber)];
            return '<tr class="' + sel + '" onclick="selectRow(\'' + r.id + '\')">' +
              '<td>' + escapeHtml(f.sentDate || '-') + '</td>' +
              '<td style="font-weight:800;">' + escapeHtml(f.docNumber || '-') + '</td>' +
              '<td>' + escapeHtml(f.sender || '-') + '</td>' +
              '<td style="font-weight:800;">' + escapeHtml(f.title || '-') + '</td>' +
              '<td>' + escapeHtml(f.aiSummary || '-') + '</td>' +
              '<td>' + escapeHtml(f.replyDeadline || '-') + '</td>' +
              '<td style="font-weight:900; color:' + (isRep ? '#15803d' : '#94a3b8') + ';">' + (isRep ? '○' : '-') + '</td>' +
              '<td>' + escapeHtml(f.uploader || '-') + '</td>' +
              buildApprovalCellHtml(r) +
              '</tr>';
          }).join('');
        } else {
          thead.innerHTML = '<tr>' +
            '<th style="width:76px;" class="' + thClass('date', false) + '" onclick="toggleSort(\'date\');">날짜' + sortArrow('date') + '</th>' +
            '<th style="width:90px;" class="' + thClass('docNumber', false) + '" onclick="toggleSort(\'docNumber\');">공문번호' + sortArrow('docNumber') + '</th>' +
            '<th style="width:92px;" class="' + thClass('clinic', false) + '" onclick="toggleSort(\'clinic\');">받는사람' + sortArrow('clinic') + '</th>' +
            '<th style="width:90px;" class="' + thClass('replyDocNumber', false) + '" onclick="toggleSort(\'replyDocNumber\');">회신번호' + sortArrow('replyDocNumber') + '</th>' +
            '<th style="width:140px;" class="' + thClass('title', false) + '" onclick="toggleSort(\'title\');">제목' + sortArrow('title') + '</th>' +
            '<th style="width:165px;" class="' + thClass('aiSummary', false) + '" onclick="toggleSort(\'aiSummary\');">내용' + sortArrow('aiSummary') + '</th>' +
            '<th style="width:64px;" class="' + thClass('uploader', false) + '" onclick="toggleSort(\'uploader\');">올린사람' + sortArrow('uploader') + '</th>' +
            '<th style="width:68px;" class="' + thClass('approval', false) + '" onclick="toggleSort(\'approval\');">결재' + sortArrow('approval') + '</th>' +
            '</tr>';
          tbody.innerHTML = list.map(function(r) {
            const f = r.fields || {};
            const sel = r.id === selectedId ? 'selected' : '';
            return '<tr class="' + sel + '" onclick="selectRow(\'' + r.id + '\')">' +
              '<td>' + escapeHtml(f.sentDate || '-') + '</td>' +
              '<td style="font-weight:800;">' + escapeHtml(f.docNumber || '-') + '</td>' +
              '<td>' + escapeHtml(f.recipient || f.sender || '-') + '</td>' +
              '<td>' + escapeHtml(f.replyDocNumber || '-') + '</td>' +
              '<td style="font-weight:800;">' + escapeHtml(f.title || '-') + '</td>' +
              '<td>' + escapeHtml(f.aiSummary || '-') + '</td>' +
              '<td>' + escapeHtml(f.uploader || '-') + '</td>' +
              buildApprovalCellHtml(r) +
              '</tr>';
          }).join('');
        }
      }

      const cur = list.find(function(r) { return r.id === selectedId; });
      const imgEl = document.getElementById('preview-img');
      const pageBar = document.getElementById('photo-page-bar');
      if (!cur) {
        imgEl.removeAttribute('src');
        pageBar.style.display = 'none';
        return;
      }
      const mainSrc = cur.base64Image
        ? (cur.base64Image.indexOf('data:') === 0 ? cur.base64Image : ('data:image/jpeg;base64,' + cur.base64Image))
        : (cur.imagePath || '');
      const pages = [mainSrc];
      const extraArr = getExtraArray(cur);
      extraArr.forEach(function(b) {
        const s = String(b || '');
        pages.push(s.indexOf('data:') === 0 ? s : ('data:image/jpeg;base64,' + s));
      });

      if (cur.category === '병원비' || cur.category === 'PDF변환' || pages.length > 1) {
        pageBar.style.display = 'flex';
        let barHtml = '';
        pages.forEach(function(_, idx) {
          const cls = idx === selectedPageIdx ? 'page-tab active' : 'page-tab';
          const lbl = cur.category === '병원비'
            ? (idx === 0 ? '기본 영수증' : ('증빙첨부 ' + idx))
            : ((idx + 1) + '페이지');
          barHtml += '<button class="' + cls + '" onclick="selectedPageIdx=' + idx + '; resetZoom(); render();">' + lbl;
          if (idx > 0) {
            barHtml += ' <span class="page-del" onclick="removeExtraPage(' + (idx - 1) + ', event)">✕</span>';
          }
          barHtml += '</button>';
        });
        barHtml += '<button class="page-add" onclick="triggerAddExtraPage()">+ ' + (cur.category === 'PDF변환' ? '페이지 추가' : '증빙첨부 추가') + '</button>';
        pageBar.innerHTML = barHtml;
      } else {
        pageBar.style.display = 'none';
      }
      if (selectedPageIdx >= pages.length) selectedPageIdx = 0;
      imgEl.src = pages[selectedPageIdx] || pages[0] || '';
    }

    function downloadModifiedHtml() {
      const jsonStr = JSON.stringify(archiveRecords);
      const fullHtml = document.documentElement.outerHTML;
      const sIdx = fullHtml.indexOf('/*ARCHIVE_DATA_START*/');
      const eIdx = fullHtml.indexOf('/*ARCHIVE_DATA_END*/');
      if (sIdx === -1 || eIdx === -1) return;
      const updatedHtml = '<!DOCTYPE html>\n' +
        fullHtml.substring(0, sIdx + '/*ARCHIVE_DATA_START*/'.length) +
        ' ' + jsonStr + ' ' +
        fullHtml.substring(eIdx);
      const blob = new Blob([updatedHtml], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '증빙서류_' + selectedCategoryFilter + '_수정본.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function exportPdfPrint() {
      window.print();
    }

    // ★ 1. 리스트와 사진 사이 조절바 (모바일 touchstart/touchmove + 마우스 완벽 지원)
    (function initResizer() {
      const bar = document.getElementById('resizer-bar');
      const listPane = document.getElementById('list-pane');
      const ws = document.getElementById('workspace');
      let dragging = false;

      function applyResize(clientX, clientY) {
        const rect = ws.getBoundingClientRect();
        const isLand = window.innerWidth > window.innerHeight;
        if (isLand) {
          const pct = Math.min(80, Math.max(20, ((clientX - rect.left) / rect.width) * 100));
          listPane.style.flex = '0 0 ' + pct + '%';
        } else {
          const pct = Math.min(82, Math.max(18, ((clientY - rect.top) / rect.height) * 100));
          listPane.style.flex = '0 0 ' + pct + '%';
        }
      }

      bar.addEventListener('mousedown', function(e) {
        dragging = true;
        e.preventDefault();
      });
      window.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        applyResize(e.clientX, e.clientY);
      });
      window.addEventListener('mouseup', function() {
        dragging = false;
      });

      bar.addEventListener('touchstart', function(e) {
        dragging = true;
        if (e.cancelable) e.preventDefault();
      }, { passive: false });
      window.addEventListener('touchmove', function(e) {
        if (!dragging || !e.touches || e.touches.length === 0) return;
        if (e.cancelable) e.preventDefault();
        applyResize(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      window.addEventListener('touchend', function() {
        dragging = false;
      });
    })();

    // ★ 2. 사진 두 손가락 핀치 확대/축소(15% ~ 800%) + 한 손가락 드래그 이동 (모바일 & PC 완벽 지원)
    (function initPhotoTouchZoom() {
      const vp = document.getElementById('photo-viewport');
      let isPinching = false;
      let startDist = 0;
      let startZoom = 1.0;
      let isPanning = false;
      let startPanX = 0;
      let startPanY = 0;

      function getTouchDist(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      vp.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          isPinching = true;
          isPanning = false;
          startDist = getTouchDist(e.touches[0], e.touches[1]);
          startZoom = currentZoom;
          if (e.cancelable) e.preventDefault();
        } else if (e.touches.length === 1) {
          isPanning = true;
          startPanX = e.touches[0].clientX - panX;
          startPanY = e.touches[0].clientY - panY;
        }
      }, { passive: false });

      vp.addEventListener('touchmove', function(e) {
        if (isPinching && e.touches.length === 2) {
          if (e.cancelable) e.preventDefault();
          const dist = getTouchDist(e.touches[0], e.touches[1]);
          if (startDist > 10) {
            currentZoom = Math.min(8.0, Math.max(0.15, startZoom * (dist / startDist)));
            applyZoom();
          }
        } else if (isPanning && e.touches.length === 1) {
          if (e.cancelable) e.preventDefault();
          panX = e.touches[0].clientX - startPanX;
          panY = e.touches[0].clientY - startPanY;
          applyZoom();
        }
      }, { passive: false });

      vp.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) isPinching = false;
        if (e.touches.length === 0) {
          isPanning = false;
        }
      });

      vp.addEventListener('wheel', function(e) {
        e.preventDefault();
        changeZoom(e.deltaY < 0 ? 0.25 : -0.25);
      }, { passive: false });
    })();

    render();
  </script>
