가 약 550~650만 원 선으로, RC(800만 원)나 철골(850~900만 원) 방식보다 저렴함을 확인\n◦ 단층 모듈러의 경우 하자 발생 확률이 낮고 시공 속도가 빨라 하동 프로젝트에 적합하다는 의견 제시\n◦ 공간제작소, 자이가이스트 등 주요 모듈러 업체들의 장단점 및 시장 현황 공유\n\n• 현장 진입 및 물류 문제\n◦ 모듈러 자재 반입 시 하동 현장 인근의 좁은 도로(약 200~250m 구간)와 식당가 불법 주차 문제가 걸림돌로 지적됨\n◦ 자재 반입 당일 신호수 배치 및 주차 통제 등 구체적인 교통 관리 방안 필요\n\n• 기반 시설 및 인허가\n◦ 공사 부지 내 전신주 이설이 필수적이며, 한전(KEPCO)과의 협의 및 신청 기간(약 3개월 소요) 고려 필요\n◦ 12월 중순까지 도서 작성을 완료하고 내년 1월까지 인허가를 마쳐야 하는 촉박한 일정 공유\n\n• 인력 숙소 운영\n◦ 외부 인력 투입 시 숙박비 부담을 줄이기 위해 하동 군내의 빈 건물이나 기존 시설을 개조하여 숙소로 활용하는 방안 검토\n\n3. 결정 사항\n\n• 경제성과 시공성을 고려하여 목조 모듈러 방식을 우선적으로 추진하기로 함\n• 공사비 절감을 위해 현지 유휴 공간을 활용한 근로자 숙소 운영 계획을 구체화하기로 함\n• 전신주 이설 등 시간이 소요되는 행정 절차를 조기에 착수하기로 함\n\n4. 향후 할 일 (Action Items)\n\n• 모듈러 업체(공간제작소 등)와 협의하여 최종 설계 도서 및 상세 견적 산출\n• 한전 및 관련 기관에 전신주 이설 및 가설 전기 신청 (3개월 전 사전 신청 준수)\n• 하동군청과 협의하여 공사 기간 중 진입로 확보 및 불법 주차 단속 협조 요청\n• 내년 1월 인허가 완료를 목표로 설계 및 행정 절차 일정 관리\n• 현장 인력 숙소로 활용 가능한 지역 내 건물 후보지 확정 및 계약 검토\n• 우회도로 개설한 목적이 단지 귀농귀촌 단지를 위해 놓는 것인지\n• 하동군에게 조기개통에 대한 확답을 받아야 함\n• 우회도로 진입시에 회전이 안되는 문제가 있어 코너를 넓혀주어야 함\n• 도면확정 》견적 》모듈러검토 》인허가\n• 감리가 별도로 있는지\n•","lineStyles":{"0":{"fontSize":11.0},"49":{"fontSize":14.5},"50":{"fontSize":14.5},"51":{"fontSize":14.5},"52":{"fontSize":14.5},"53":{"fontSize":14.5},"54":{"fontSize":14.5}},"imageFiles":[],"docFiles":[],"audioFileNames":["음성 261117_134750.m4a"],"updatedAt":"2026-11-17T16:49:18.362098"}}} /*CAL_MEMO_DATA_END*/;</script></body></html>
